<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="원바틀">
  <meta name="theme-color" content="#07090d">
  <title>원바틀 (One Bottle)</title>

  <!-- iOS 홈 화면 고해상도 앱 아이콘 동적 생성 -->
  <script>
    (function initAppIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createRadialGradient(90, 90, 10, 90, 90, 110);
      bg.addColorStop(0, '#131b26');
      bg.addColorStop(1, '#07090e');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 180, 180);

      ctx.strokeStyle = 'rgba(16, 185, 129, 0.45)';
      ctx.lineWidth = 3;
      ctx.strokeRect(6, 6, 168, 168);

      // 참이슬형 초록 소주병
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(52, 38, 16, 14); // 캡
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.moveTo(52, 52);
      ctx.lineTo(68, 52);
      ctx.lineTo(76, 75);
      ctx.lineTo(76, 142);
      ctx.lineTo(44, 142);
      ctx.lineTo(44, 75);
      ctx.closePath();
      ctx.fill();

      // 소주잔 2/3 실루엣
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(98, 76, 32, 46);
      ctx.fillStyle = 'rgba(52, 211, 153, 0.85)';
      ctx.fillRect(100, 92, 28, 28);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 15px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ONE BOTTLE', 90, 160);

      const url = canvas.toDataURL('image/png');
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = url;
      document.head.appendChild(link);
    })();
  </script>

  <style>
    :root {
      --bg-dark: #07090d;
      --card-glass: rgba(18, 24, 35, 0.65);
      --card-glass-active: rgba(26, 36, 52, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.22);
      
      --accent-soju: #10b981;
      --accent-soju-glow: rgba(16, 185, 129, 0.35);
      --accent-wine: #e11d48;
      --accent-beer: #f59e0b;
      --accent-whiskey: #d97706;
      --accent-makgeolli: #94a3b8;
      --accent-etc: #06b6d4;

      --theme-accent: var(--accent-soju);
      --theme-glow: var(--accent-soju-glow);

      --danger: #f43f5e;
      --warning: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #151d2a 0%, #0c1017 50%, var(--bg-dark) 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Pretendard", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 85px) 18px;
      touch-action: manipulation;
      overflow-x: hidden;
      letter-spacing: -0.015em;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0 10px 0;
    }
    .brand-box h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-box p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 1px;
    }
    .header-btns { display: flex; gap: 8px; }
    .glass-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-sub);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .glass-btn:active {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(0.96);
    }

    /* 앰버 알림 */
    #amber-banner {
      display: none;
      background: rgba(251, 191, 36, 0.08);
      border: 1px solid rgba(251, 191, 36, 0.3);
      backdrop-filter: blur(8px);
      color: #fbbf24;
      border-radius: 12px;
      padding: 10px 14px;
      margin: 8px 0 4px 0;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.4;
      animation: ambientPulse 2.5s infinite ease-in-out;
    }
    @keyframes ambientPulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.45; } }

    /* 멀티 보틀 쇼케이스 */
    .showcase-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 6px 0;
    }
    .ambient-glow-disc {
      position: absolute;
      top: 10%;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: var(--theme-glow);
      filter: blur(55px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.4s ease;
    }
    .bottles-flex-rack {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 14px;
      height: 185px;
      min-width: 140px;
    }
    .bottle-unit {
      position: relative;
      width: 72px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .bottle-unit svg { width: 100%; height: 100%; filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5)); }

    .status-summary {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 6px;
    }
    .quota-percent {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--theme-accent);
      transition: color 0.3s;
    }
    .quota-fraction {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 1px;
    }

    /* 탭 바 */
    .capsule-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 2px 14px 2px;
      scrollbar-width: none;
    }
    .capsule-tabs::-webkit-scrollbar { display: none; }
    .capsule-tab {
      flex: 0 0 auto;
      padding: 7px 14px;
      background: var(--card-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .capsule-tab.active {
      border-color: var(--theme-accent);
      background: var(--card-glass-active);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 16px var(--theme-glow);
    }

    /* 잔 그리드 */
    .glasses-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .glass-tile {
      aspect-ratio: 0.9;
      background: var(--card-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-tile:active { transform: scale(0.93); }
    .glass-tile.filled {
      border-color: var(--theme-accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 0 16px var(--theme-glow), 0 4px 12px rgba(0, 0, 0, 0.3);
    }
    .tile-svg-box {
      width: 44px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-svg-box svg { width: 100%; height: 100%; }
    .tile-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
    }
    .glass-tile.filled .tile-label { color: var(--text-main); }

    /* 초과 잔 [+] */
    .glass-tile.tile-extra {
      border: 1.5px dashed var(--danger);
      background: rgba(244, 63, 94, 0.08);
      animation: dangerPulse 1.8s infinite;
    }
    @keyframes dangerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .glass-tile.tile-extra .tile-label { color: var(--danger); font-weight: 700; }

    /* 우측 하단 H2O 플로팅 버튼 */
    .h2o-floater {
      position: fixed;
      right: 18px;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.85), rgba(3, 105, 161, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      z-index: 80;
      transition: transform 0.15s ease;
    }
    .h2o-floater:active { transform: scale(0.92); }
    .h2o-label { font-size: 0.85rem; font-weight: 700; color: #ffffff; letter-spacing: 0.02em; }
    .h2o-badge {
      background: rgba(255, 255, 255, 0.95);
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 1px 7px;
      border-radius: 12px;
    }

    /* 모달 */
    .overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .glass-dialog {
      background: #0f141d;
      border: 1px solid var(--border-focus);
      border-radius: 22px;
      width: 100%;
      max-width: 390px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .glass-dialog h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .glass-dialog p { font-size: 0.82rem; color: var(--text-sub); }

    .bev-item-card {
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bev-item-card.selected {
      border-color: var(--accent-soju);
      background: rgba(16, 185, 129, 0.06);
    }
    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bev-check-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .unit-switch {
      display: flex;
      background: #090c12;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-subtle);
    }
    .unit-opt {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.74rem;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    .unit-opt.on {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-weight: 700;
    }
    .card-bottomline {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .formula-txt { font-size: 0.76rem; color: var(--text-sub); }
    .stepper-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stepper-box button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .stepper-box strong { font-size: 1rem; min-width: 20px; text-align: center; }

    .btn-action-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }

    /* 거울치료 */
    #mirror-modal .glass-dialog {
      border-color: rgba(244, 63, 94, 0.4);
      text-align: center;
      padding: 26px;
    }
    .camera-disc {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      margin: 12px auto;
      overflow: hidden;
      border: 3px solid var(--danger);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.5);
      background: #000;
    }
    #camera-view {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="brand-box">
      <h1>원바틀</h1>
      <p id="header-date">오늘의 1차 절주</p>
    </div>
    <div class="header-btns">
      <button class="glass-btn" onclick="openSettings()">⚙️ 주량 설정</button>
      <button class="glass-btn" onclick="requestReset()">🔄 리셋</button>
    </div>
  </header>

  <!-- 막잔 경고 배너 -->
  <div id="amber-banner">⚠️ 이번 차수 마지막 잔입니다. 물 한 잔을 마시며 1차를 멋지게 완성하세요.</div>

  <!-- 멀티 보틀 쇼케이스 -->
  <section class="showcase-stage">
    <div class="ambient-glow-disc" id="ambient-disc"></div>
    <div class="bottles-flex-rack" id="bottles-rack"></div>
    <div class="status-summary">
      <div class="quota-percent" id="status-percent">0%</div>
      <div class="quota-fraction" id="status-desc">주량 동기화 중...</div>
    </div>
  </section>

  <!-- 주종 캡슐 탭 -->
  <div class="capsule-tabs" id="tabs-bar"></div>

  <!-- 잔 그리드 -->
  <div class="glasses-grid" id="glasses-grid"></div>

  <!-- H2O 플로팅 버튼 -->
  <div class="h2o-floater" onclick="drinkWater()">
    <span style="font-size:1.05rem;">💧</span>
    <span class="h2o-label">H₂O</span>
    <span class="h2o-badge" id="h2o-badge">0</span>
  </div>

  <!-- 주량 설정 모달 -->
  <div class="overlay-backdrop" id="settings-modal">
    <div class="glass-dialog">
      <div>
        <h2>1차 주량 설정</h2>
        <p>오늘 마실 주종과 한계 주량을 설정하세요.</p>
      </div>
      <div id="settings-card-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      <button class="btn-action-primary" onclick="commitSettings()">주량 저장 및 시작</button>
    </div>
  </div>

  <!-- 거울치료 모달 -->
  <div class="overlay-backdrop" id="mirror-modal">
    <div class="glass-dialog">
      <h2 style="color:var(--danger);">⚠️ 1차 주량 한계선 도달</h2>
      <div class="camera-disc">
        <video id="camera-view" autoplay playsinline muted></video>
      </div>
      <p style="line-height:1.5; color:var(--text-main);">
        지금 당신의 풀린 눈빛과 붉어진 얼굴을 똑바로 보세요.<br>
        <strong>1차의 품격은 스스로 멈출 때 완성됩니다. 즉시 귀가하세요!</strong>
      </p>
      <button class="btn-action-primary" style="background:var(--danger); color:#fff;" onclick="closeMirror()">거울 닫고 절주하기</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       참이슬 실물 기반 초록 소주병 (정밀 벡터 SVG 에셋)
       ========================================================================== */
    function getChamisulBottleSvg(uniqueId, fillPercent) {
      // 바디 높이 매핑 (액체 수위 y좌표: 172(바닥) ~ 38(병목 상단))
      const fillHeight = Math.min(Math.max(fillPercent, 0), 1.0) * 134;
      const yPos = 172 - fillHeight;

      return `
      <svg viewBox="0 0 74 185" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 참이슬 실물 곡선 클립패스 -->
          <clipPath id="chamisul-clip-${uniqueId}">
            <path d="M 28 8 H 46 V 26 H 28 Z
                     M 26 26 H 48 V 40 Q 48 42 49 43 Q 46 44 48 48 L 52 64 Q 66 76 66 90 V 170 Q 66 178 58 178 H 16 Q 8 178 8 170 V 90 Q 8 76 22 64 L 26 48 Q 28 44 25 43 Q 26 42 26 40 Z" />
          </clipPath>
          <linearGradient id="soju-liquid-grad-${uniqueId}" x1="0" y1="0" x2="0" y2="185" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="50%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#047857"/>
          </linearGradient>
          <radialGradient id="dewdrop-${uniqueId}" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="80%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </radialGradient>
        </defs>

        <!-- 병 내부 액체 충전 영역 -->
        <g clip-path="url(#chamisul-clip-${uniqueId})">
          <!-- 비어있는 참이슬 짙은 초록색 유리톤 -->
          <rect width="74" height="185" fill="#072213"/>
          <!-- 차오르는 영롱한 에메랄드 소주 액체 -->
          <rect x="0" y="${yPos}" width="74" height="${fillHeight}" fill="url(#soju-liquid-grad-${uniqueId})" style="transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);"/>
          <!-- 액체 수면 림 (Meniscus) -->
          <ellipse cx="37" cy="${yPos}" rx="28" ry="3" fill="#6ee7b7" opacity="${fillPercent > 0 ? 0.75 : 0}"/>
        </g>

        <!-- 참이슬 특유의 투명 에메랄드 외곽 라인 -->
        <path d="M 28 8 H 46 V 26 H 28 Z
                 M 26 26 H 48 V 40 Q 48 42 49 43 Q 46 44 48 48 L 52 64 Q 66 76 66 90 V 170 Q 66 178 58 178 H 16 Q 8 178 8 170 V 90 Q 8 76 22 64 L 26 48 Q 28 44 25 43 Q 26 42 26 40 Z"
              stroke="#22c55e" stroke-width="1.8" stroke-opacity="0.8" fill="rgba(34, 197, 94, 0.08)"/>

        <!-- 병 좌측 곡면을 타고 흐르는 리얼한 수직 유리 반사광 (Specular) -->
        <path d="M 29 44 L 24 64 Q 12 76 12 90 V 168" stroke="rgba(255, 255, 255, 0.4)" stroke-width="2" stroke-linecap="round" fill="none"/>
        <!-- 우측 가장자리 미세 반사광 -->
        <path d="M 62 92 V 166" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" stroke-linecap="round" fill="none"/>

        <!-- 병목 중간 유리 엠보싱 링 (실물 디테일) -->
        <ellipse cx="37" cy="44" rx="11" ry="1.6" stroke="#16a34a" stroke-width="1.2" fill="none" opacity="0.85"/>

        <!-- 참이슬 시그니처 초록 금속 캡 (리브 홈 & 안전 링) -->
        <rect x="27" y="8" width="20" height="18" rx="2" fill="#1b5e20"/>
        <line x1="30" y1="9" x2="30" y2="21" stroke="#4ade80" stroke-width="0.9" opacity="0.8"/>
        <line x1="34" y1="9" x2="34" y2="21" stroke="#4ade80" stroke-width="0.9" opacity="0.8"/>
        <line x1="37" y1="9" x2="37" y2="21" stroke="#4ade80" stroke-width="0.9" opacity="0.8"/>
        <line x1="40" y1="9" x2="40" y2="21" stroke="#4ade80" stroke-width="0.9" opacity="0.8"/>
        <line x1="44" y1="9" x2="44" y2="21" stroke="#4ade80" stroke-width="0.9" opacity="0.8"/>
        <rect x="26.5" y="21.5" width="21" height="4.5" rx="1" fill="#14532d" stroke="#22c55e" stroke-width="0.8"/>

    /* ==========================================================================

      const fillOp = isFilled ? "0.9" : "0";

      <svg viewBox="0 0 36 44" fill="none">
        <rect x="11" y="6" width="14" height="32" rx="1" stroke="${col}" stroke-width="1.4" fill="rgba(255,255,255,0.03)"/>
        <rect x="12" y="16" width="12" height="21" fill="#06b6d4" opacity="${fillOp}"/>

      </svg>`;
    }

    function getGlassSvgByBeverage(type, isFilled) {
      switch(type) {
        case 'soju': return getSojuGlassSvg(isFilled);
        case 'wine': return getWineGlassSvg(isFilled);
        case 'beer': return getBeerGlassSvg(isFilled);
        case 'whiskey': return getWhiskeyGlassSvg(isFilled);
        case 'makgeolli': return getMakgeolliBowlSvg(isFilled);
        default: return getEtcGlassSvg(isFilled);
      }
    }

    /* ==========================================================================
       주종 메타데이터 및 상태 관리
       ========================================================================== */
    const BEV_CATALOG = {
      soju:      { name: '소주',   ratio: 8,   unit: '병', glass: '잔',   accent: '#10b981', glow: 'rgba(16, 185, 129, 0.35)' },
      wine:      { name: '와인',   ratio: 5,   unit: '병', glass: '잔',   accent: '#e11d48', glow: 'rgba(225, 29, 72, 0.35)' },
      beer:      { name: '맥주',   ratio: 1.5, unit: '캔', glass: '잔',   accent: '#f59e0b', glow: 'rgba(245, 158, 11, 0.35)' },
      whiskey:   { name: '위스키', ratio: 1,   unit: '잔', glass: '잔',   accent: '#d97706', glow: 'rgba(217, 119, 6, 0.35)' },
      makgeolli: { name: '막걸리', ratio: 5,   unit: '병', glass: '사발', accent: '#94a3b8', glow: 'rgba(148, 163, 184, 0.3)' },
      etc:       { name: '하이볼', ratio: 1,   unit: '잔', glass: '잔',   accent: '#06b6d4', glow: 'rgba(6, 182, 212, 0.35)' }
    };

    let appConfig = JSON.parse(localStorage.getItem('obConfig_v3')) || {
      isSet: false,
      activeKeys: ['soju'],
      targets: {
        soju: { mode: 'bottle', count: 1, totalGlasses: 8 },
        wine: { mode: 'bottle', count: 1, totalGlasses: 5 },
        beer: { mode: 'bottle', count: 2, totalGlasses: 3 },
        whiskey: { mode: 'glass', count: 3, totalGlasses: 3 },
        makgeolli: { mode: 'bottle', count: 1, totalGlasses: 5 },
        etc: { mode: 'glass', count: 2, totalGlasses: 2 }
      }
    };

    let appSession = JSON.parse(localStorage.getItem('obSession_v3')) || {
      currentTab: 'soju',
      intake: {},
      overtake: {},
      water: 0,
      timeMark: Date.now()
    };

    let streamRef = null;

    function initApp() {
      const now = new Date();
      document.getElementById('header-date').innerText = 
        `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')}`;

      if (Date.now() - appSession.timeMark > 6 * 3600 * 1000) {
        requestReset(false);
      }

      if (!appConfig.isSet || !appConfig.activeKeys || appConfig.activeKeys.length === 0) {
        openSettings();
      } else {
        if (!appConfig.activeKeys.includes(appSession.currentTab)) {
          appSession.currentTab = appConfig.activeKeys[0];
        }
        syncThemeColor();
        renderTabCapsules();
        renderGlassGrid();
        updateMainInterface();
      }
    }

    function syncThemeColor() {
      const activeMeta = BEV_CATALOG[appSession.currentTab] || BEV_CATALOG.soju;
      document.documentElement.style.setProperty('--theme-accent', activeMeta.accent);
      document.documentElement.style.setProperty('--theme-glow', activeMeta.glow);
    }

    function calculateTotalProgress() {
      let quotaRatio = 0;
      for (const key of appConfig.activeKeys) {
        const consumed = (appSession.intake[key] || 0) + (appSession.overtake[key] || 0);
        const limit = appConfig.targets[key].totalGlasses;
        quotaRatio += (consumed / limit);
      }
      return quotaRatio;
    }

    function updateMainInterface() {
      syncThemeColor();
      const progress = calculateTotalProgress();
      const pct = Math.round(progress * 100);

      const curKey = appSession.currentTab;
      const meta = BEV_CATALOG[curKey];
      const target = appConfig.targets[curKey];
      const consumed = appSession.intake[curKey] || 0;
      const extra = appSession.overtake[curKey] || 0;

      // 상단 멀티 보틀 쇼케이스 렌더링
      renderMultiBottles(curKey, target, consumed);

      const pctEl = document.getElementById('status-percent');
      pctEl.innerText = `${pct}%`;
      pctEl.style.color = pct >= 100 ? 'var(--danger)' : 'var(--theme-accent)';

      let bottleStr = '';
      if (target.mode === 'bottle') {
        const curBottle = (consumed / meta.ratio).toFixed(1).replace('.0','');
        bottleStr = ` (${curBottle} / ${target.count}병)`;
      }
      document.getElementById('status-desc').innerText = 
        `${meta.name} ${consumed + extra} / ${target.totalGlasses}${meta.glass}${bottleStr}`;

      const amber = document.getElementById('amber-banner');
      const remain = target.totalGlasses - consumed;
      if (progress < 1.0 && (remain === 1 || pct >= 85)) {
        amber.style.display = 'block';
      } else {
        amber.style.display = 'none';
      }

      document.getElementById('h2o-badge').innerText = appSession.water;
      localStorage.setItem('obSession_v3', JSON.stringify(appSession));
    }

    function renderMultiBottles(key, target, totalConsumed) {
      const rack = document.getElementById('bottles-rack');
      rack.innerHTML = '';

      const meta = BEV_CATALOG[key];
      const numBottles = target.mode === 'bottle' ? target.count : Math.max(1, Math.ceil(target.totalGlasses / meta.ratio));
      const glassesPerBottle = meta.ratio;

      for (let i = 0; i < numBottles; i++) {
        const bottleStart = i * glassesPerBottle;
        const bottleEnd = (i + 1) * glassesPerBottle;
        let bottleFillFraction = 0;

        if (totalConsumed >= bottleEnd) {
          bottleFillFraction = 1.0;
        } else if (totalConsumed <= bottleStart) {
          bottleFillFraction = 0;
        } else {
          bottleFillFraction = (totalConsumed - bottleStart) / glassesPerBottle;
        }

        const unit = document.createElement('div');
        unit.className = 'bottle-unit';
        unit.innerHTML = renderBottleSvgDispatcher(key, `b-${i}`, bottleFillFraction);
        rack.appendChild(unit);
      }
    }

    function renderTabCapsules() {
      const bar = document.getElementById('tabs-bar');
      bar.innerHTML = '';

      appConfig.activeKeys.forEach(k => {
        const item = BEV_CATALOG[k];
        const tab = document.createElement('div');
        tab.className = `capsule-tab ${appSession.currentTab === k ? 'active' : ''}`;
        tab.innerHTML = `<span>${item.name}</span>`;
        tab.onclick = () => {
          appSession.currentTab = k;
          renderTabCapsules();
          renderGlassGrid();
          updateMainInterface();
        };
        bar.appendChild(tab);
      });
    }

    function renderGlassGrid() {
      const grid = document.getElementById('glasses-grid');
      grid.innerHTML = '';

      const key = appSession.currentTab;
      const meta = BEV_CATALOG[key];
      const limit = appConfig.targets[key].totalGlasses;
      const consumed = appSession.intake[key] || 0;
      const extra = appSession.overtake[key] || 0;

      for (let i = 1; i <= limit; i++) {
        const tile = document.createElement('div');
        const isFilled = i <= consumed;
        tile.className = `glass-tile ${isFilled ? 'filled' : ''}`;
        tile.innerHTML = `
          <div class="tile-svg-box">${getGlassSvgByBeverage(key, isFilled)}</div>
          <div class="tile-label">${i}${meta.glass}</div>
        `;
        tile.onclick = () => onGlassTap(i);
        grid.appendChild(tile);
      }

      if (consumed >= limit) {
        const extraTile = document.createElement('div');
        extraTile.className = 'glass-tile tile-extra';
        extraTile.innerHTML = `
          <div style="font-size:1.6rem; color:var(--danger); font-weight:800; line-height:1;">+</div>
          <div class="tile-label">초과 ${extra}잔</div>
        `;
        extraTile.onclick = () => onExtraGlassTap();
        grid.appendChild(extraTile);
      }
    }

    function onGlassTap(index) {
      const key = appSession.currentTab;
      const current = appSession.intake[key] || 0;

      if (index === current) {
        appSession.intake[key]--;
      } else {
        appSession.intake[key] = index;
      }
      renderGlassGrid();
      updateMainInterface();

      if (calculateTotalProgress() >= 1.0 && 'vibrate' in navigator) {
        navigator.vibrate([100, 60, 100]);
      }
    }

    function onExtraGlassTap() {
      const key = appSession.currentTab;
      appSession.overtake[key] = (appSession.overtake[key] || 0) + 1;
      renderGlassGrid();
      updateMainInterface();
      triggerRealityMirror();
    }

    function drinkWater() {
      appSession.water = (appSession.water || 0) + 1;
      updateMainInterface();
      if ('vibrate' in navigator) navigator.vibrate(35);
    }

    async function triggerRealityMirror() {
      const modal = document.getElementById('mirror-modal');
      const video = document.getElementById('camera-view');
      modal.style.display = 'flex';

      try {
        streamRef = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' }
        });
        video.srcObject = streamRef;
      } catch (e) {
        console.warn('전면 카메라 접근 불가:', e);
      }
    }

    function closeMirror() {
      document.getElementById('mirror-modal').style.display = 'none';
      if (streamRef) {
        streamRef.getTracks().forEach(t => t.stop());
        streamRef = null;
      }
    }

    function openSettings() {
      const container = document.getElementById('settings-card-list');
      container.innerHTML = '';

      for (const [key, meta] of Object.entries(BEV_CATALOG)) {
        const isChecked = appConfig.activeKeys.includes(key);
        const tgt = appConfig.targets[key];

        const card = document.createElement('div');
        card.className = `bev-item-card ${isChecked ? 'selected' : ''}`;
        card.id = `bev-item-${key}`;

        card.innerHTML = `
          <div class="card-topline">
            <label class="bev-check-label">
              <input type="checkbox" id="chk-${key}" ${isChecked ? 'checked' : ''} onchange="toggleBev('${key}')" style="width:18px; height:18px; accent-color:var(--accent-soju);">
              <span>${meta.name}</span>
            </label>
            ${meta.ratio > 1 ? `
              <div class="unit-switch">
                <button class="unit-opt ${tgt.mode === 'bottle' ? 'on' : ''}" onclick="changeUnit('${key}', 'bottle')">${meta.unit}</button>
                <button class="unit-opt ${tgt.mode === 'glass' ? 'on' : ''}" onclick="changeUnit('${key}', 'glass')">${meta.glass}</button>
              </div>
            ` : `<span style="font-size:0.75rem; color:var(--text-dim);">잔 전용</span>`}
          </div>

          <div class="card-bottomline">
            <span class="formula-txt" id="formula-${key}">계산 중...</span>
            <div class="stepper-box">
              <button onclick="stepTarget('${key}', -1)">-</button>
              <strong id="count-disp-${key}">${tgt.count}</strong>
              <button onclick="stepTarget('${key}', 1)">+</button>
            </div>
          </div>
        `;
        container.appendChild(card);
        updateCardFormula(key);
      }

      document.getElementById('settings-modal').style.display = 'flex';
    }

    function toggleBev(key) {
      const chk = document.getElementById(`chk-${key}`);
      const card = document.getElementById(`bev-item-${key}`);
      if (chk.checked) {
        if (!appConfig.activeKeys.includes(key)) appConfig.activeKeys.push(key);
        card.classList.add('selected');
      } else {
        appConfig.activeKeys = appConfig.activeKeys.filter(k => k !== key);
        card.classList.remove('selected');
      }
    }

    function changeUnit(key, mode) {
      appConfig.targets[key].mode = mode;
      const meta = BEV_CATALOG[key];
      if (mode === 'bottle') {
        appConfig.targets[key].count = Math.max(1, Math.round(appConfig.targets[key].totalGlasses / meta.ratio)) || 1;
      } else {
        appConfig.targets[key].count = appConfig.targets[key].totalGlasses;
      }
      openSettings();
    }

    function stepTarget(key, delta) {
      const current = appConfig.targets[key].count + delta;
      if (current < 1 || current > 20) return;
      appConfig.targets[key].count = current;
      document.getElementById(`count-disp-${key}`).innerText = current;
      updateCardFormula(key);
    }

    function updateCardFormula(key) {
      const meta = BEV_CATALOG[key];
      const tgt = appConfig.targets[key];
      if (tgt.mode === 'bottle') {
        tgt.totalGlasses = Math.round(tgt.count * meta.ratio);
        document.getElementById(`formula-${key}`).innerText = 
          `${tgt.count}${meta.unit} = 총 ${tgt.totalGlasses}${meta.glass}`;
      } else {
        tgt.totalGlasses = tgt.count;
        const bVal = (tgt.count / meta.ratio).toFixed(1).replace('.0','');
        document.getElementById(`formula-${key}`).innerText = 
          meta.ratio > 1 ? `총 ${tgt.totalGlasses}${meta.glass} (약 ${bVal}${meta.unit})` : `총 ${tgt.totalGlasses}${meta.glass}`;
      }
    }

    function commitSettings() {
      if (appConfig.activeKeys.length === 0) {
        alert('최소 하나의 주종을 선택해 주세요.');
        return;
      }
      appConfig.isSet = true;
      localStorage.setItem('obConfig_v3', JSON.stringify(appConfig));
      document.getElementById('settings-modal').style.display = 'none';

      if (!appConfig.activeKeys.includes(appSession.currentTab)) {
        appSession.currentTab = appConfig.activeKeys[0];
      }
      renderTabCapsules();
      renderGlassGrid();
      updateMainInterface();
    }

    function requestReset(ask = true) {
      if (!ask || confirm('오늘의 1차 기록을 초기화하시겠습니까?')) {
        appSession.intake = {};
        appSession.overtake = {};
        appSession.water = 0;
        appSession.timeMark = Date.now();
        localStorage.setItem('obSession_v3', JSON.stringify(appSession));
        renderGlassGrid();
        updateMainInterface();
      }
    }

    initApp();
  </script>
</body>
</html>
