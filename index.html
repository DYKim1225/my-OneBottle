<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="원바틀">
  <meta name="theme-color" content="#06080c">
  <title>원바틀 (One Bottle)</title>

  <!-- iOS 홈 화면 고해상도 앱 아이콘 동적 생성 -->
  <script>
    (function initAppIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      const bg = ctx.createRadialGradient(90, 90, 10, 90, 90, 110);
      bg.addColorStop(0, '#151d2a');
      bg.addColorStop(1, '#06080d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 180, 180);

      ctx.strokeStyle = 'rgba(16, 185, 129, 0.45)';
      ctx.lineWidth = 3;
      ctx.strokeRect(6, 6, 168, 168);

      // 초록 소주병
      ctx.fillStyle = '#1b5e20';
      ctx.fillRect(52, 38, 16, 14);
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.moveTo(52, 52);
      ctx.lineTo(68, 52);
      ctx.lineTo(76, 75);
      ctx.lineTo(76, 142);
      ctx.lineTo(44, 142);
      ctx.lineTo(44, 75);
      ctx.closePath();
      ctx.fill();

      // 소주잔 2/3 실루엣
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(98, 85, 34, 38);
      ctx.fillStyle = 'rgba(52, 211, 153, 0.85)';
      ctx.fillRect(100, 97, 30, 24);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 15px -apple-system, BlinkMacSystemFont, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ONE BOTTLE', 90, 160);

      const url = canvas.toDataURL('image/png');
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon';
      link.href = url;
      document.head.appendChild(link);
    })();
  </script>

  <style>
    :root {
      --bg-dark: #06080c;
      --card-glass: rgba(18, 24, 37, 0.72);
      --card-glass-active: rgba(28, 38, 58, 0.9);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.22);
      
      --accent-soju: #10b981;
      --accent-soju-glow: rgba(16, 185, 129, 0.35);
      --accent-wine: #e11d48;
      --accent-beer: #f59e0b;
      --accent-whiskey: #d97706;
      --accent-makgeolli: #94a3b8;
      --accent-etc: #06b6d4;

      --theme-accent: var(--accent-soju);
      --theme-glow: var(--accent-soju-glow);

      --danger: #f43f5e;
      --warning: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(2, 132, 199, 0.1) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(225, 29, 72, 0.08) 0%, transparent 50%),
        linear-gradient(180deg, #090e17 0%, #06080c 100%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", "Pretendard", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 85px) 18px;
      touch-action: manipulation;
      overflow-x: hidden;
      letter-spacing: -0.015em;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0 10px 0;
    }
    .brand-box h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-box p {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 1px;
    }
    .header-btns { display: flex; gap: 8px; }
    .glass-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--text-sub);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .glass-btn:active {
      background: rgba(255, 255, 255, 0.14);
      transform: scale(0.96);
    }

    #amber-banner {
      display: none;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.35);
      backdrop-filter: blur(10px);
      color: #fbbf24;
      border-radius: 12px;
      padding: 10px 14px;
      margin: 8px 0 4px 0;
      font-size: 0.8rem;
      text-align: center;
      line-height: 1.4;
      animation: ambientPulse 2.5s infinite ease-in-out;
    }
    @keyframes ambientPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.45; } }

    /* 상단 쇼케이스 */
    .showcase-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 6px 0;
    }
    .ambient-glow-disc {
      position: absolute;
      top: 10%;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: var(--theme-glow);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.4s ease;
    }
    .bottles-flex-rack {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      height: 185px;
      min-width: 140px;
    }
    .bottle-unit {
      position: relative;
      width: 78px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }
    .bottle-unit.mug-unit {
      width: 90px;
    }
    .bottle-unit svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); }

    .status-summary {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-top: 6px;
    }
    .quota-percent {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--theme-accent);
      transition: color 0.3s;
    }
    .quota-fraction {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 1px;
    }

    /* 탭 바 */
    .capsule-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 2px 14px 2px;
      scrollbar-width: none;
    }
    .capsule-tabs::-webkit-scrollbar { display: none; }
    .capsule-tab {
      flex: 0 0 auto;
      padding: 7px 14px;
      background: var(--card-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      backdrop-filter: blur(16px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .capsule-tab.active {
      border-color: var(--theme-accent);
      background: var(--card-glass-active);
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 4px 18px var(--theme-glow);
    }

    /* 하단 잔 그리드 */
    .glasses-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .glass-tile {
      aspect-ratio: 0.92;
      background: var(--card-glass);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-tile:active { transform: scale(0.93); }
    .glass-tile.filled {
      border-color: var(--theme-accent);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 16px var(--theme-glow), 0 4px 14px rgba(0, 0, 0, 0.35);
    }
    .tile-svg-box {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-svg-box.soju-glass-box {
      width: 38px;
      height: 38px;
    }
    .tile-svg-box svg { width: 100%; height: 100%; }
    .tile-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
    }
    .glass-tile.filled .tile-label { color: var(--text-main); }

    .glass-tile.tile-extra {
      border: 1.5px dashed var(--danger);
      background: rgba(244, 63, 94, 0.08);
      animation: dangerPulse 1.8s infinite;
    }
    @keyframes dangerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    .glass-tile.tile-extra .tile-label { color: var(--danger); font-weight: 700; }

    /* 우측 하단 생명수(H2O) 플로팅 버튼 */
    .h2o-floater {
      position: fixed;
      right: 18px;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.88), rgba(3, 105, 161, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      z-index: 80;
      transition: transform 0.15s ease;
    }
    .h2o-floater:active { transform: scale(0.92); }
    .h2o-label { font-size: 0.85rem; font-weight: 700; color: #ffffff; letter-spacing: -0.01em; }
    .h2o-badge {
      background: rgba(255, 255, 255, 0.95);
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 1px 7px;
      border-radius: 12px;
    }

    /* 설정 모달 */
    .overlay-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .glass-dialog {
      background: #0f1522;
      border: 1px solid var(--border-focus);
      border-radius: 22px;
      width: 100%;
      max-width: 390px;
      max-height: 86vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .glass-dialog h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .glass-dialog p { font-size: 0.82rem; color: var(--text-sub); }

    .bev-item-card {
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bev-item-card.selected {
      border-color: var(--accent-soju);
      background: rgba(16, 185, 129, 0.07);
    }
    .card-topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bev-check-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .icon-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      font-size: 1.15rem;
    }
    .unit-switch {
      display: flex;
      background: #090d15;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-subtle);
    }
    .unit-opt {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 0.74rem;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    .unit-opt.on {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      font-weight: 700;
    }
    .card-bottomline {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .formula-txt { font-size: 0.76rem; color: var(--text-sub); }
    .stepper-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .stepper-box button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .stepper-box strong { font-size: 1rem; min-width: 24px; text-align: center; }

    .btn-action-primary {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #000;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
    }

    /* 거울치료 */
    #mirror-modal .glass-dialog {
      border-color: rgba(244, 63, 94, 0.4);
      text-align: center;
      padding: 26px;
    }
    .camera-disc {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      margin: 12px auto;
      overflow: hidden;
      border: 3px solid var(--danger);
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.5);
      background: #000;
    }
    #camera-view {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-box">
      <h1>원바틀</h1>
      <p id="header-date">오늘의 1차 절주</p>
    </div>
    <div class="header-btns">
      <button class="glass-btn" onclick="openSettings()">⚙️ 주량 설정</button>
      <button class="glass-btn" onclick="requestReset()">🔄 리셋</button>
    </div>
  </header>

  <div id="amber-banner">⚠️ 이번 차수 마지막 잔입니다. 물 한 잔을 마시며 1차를 멋지게 완성하세요.</div>

  <!-- 상단 쇼케이스 -->
  <section class="showcase-stage">
    <div class="ambient-glow-disc" id="ambient-disc"></div>
    <div class="bottles-flex-rack" id="bottles-rack"></div>
    <div class="status-summary">
      <div class="quota-percent" id="status-percent">0%</div>
      <div class="quota-fraction" id="status-desc">주량 동기화 중...</div>
    </div>
  </section>

  <!-- 주종 캡슐 탭 -->
  <div class="capsule-tabs" id="tabs-bar"></div>

  <!-- 하단 음용 잔 그리드 -->
  <div class="glasses-grid" id="glasses-grid"></div>

  <!-- 우측 하단 생명수(H2O) 플로팅 버튼 -->
  <div class="h2o-floater" onclick="drinkWater()">
    <span style="font-size:1.05rem;">💧</span>
    <span class="h2o-label">생명수</span>
    <span class="h2o-badge" id="h2o-badge">0</span>
  </div>

  <!-- 주량 설정 모달 -->
  <div class="overlay-backdrop" id="settings-modal">
    <div class="glass-dialog">
      <div>
        <h2>1차 주량 설정</h2>
        <p>오늘 마실 주종과 한계 주량을 설정하세요.</p>
      </div>
      <div id="settings-card-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      <button class="btn-action-primary" onclick="commitSettings()">주량 저장 및 시작</button>
    </div>
  </div>

  <!-- 거울치료 모달 -->
  <div class="overlay-backdrop" id="mirror-modal">
    <div class="glass-dialog">
      <h2 style="color:var(--danger);">⚠️ 1차 주량 한계선 도달</h2>
      <div class="camera-disc">
        <video id="camera-view" autoplay playsinline muted></video>
      </div>
      <p style="line-height:1.5; color:var(--text-main);">
        지금 당신의 풀린 눈빛과 붉어진 얼굴을 똑바로 보세요.<br>
        <strong>1차의 품격은 스스로 멈출 때 완성됩니다. 즉시 귀가하세요!</strong>
      </p>
      <button class="btn-action-primary" style="background:var(--danger); color:#fff;" onclick="closeMirror()">거울 닫고 절주하기</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       I. 상단 쇼케이스 SVG (유통 및 서빙 규격)
       ========================================================================== */

    function getSojuBottleSvg(uniqueId, fillPercent) {
      const fillHeight = Math.min(Math.max(fillPercent, 0), 1.0) * 128;
      const yPos = 168 - fillHeight;

      return `
      <svg viewBox="0 0 76 182" fill="none">
        <defs>
          <clipPath id="soju-clip-${uniqueId}">
            <path d="M 31 10 H 45 V 26 H 31 Z M 30 26 H 46 V 48 C 46 60, 64 68, 64 82 V 166 C 64 174, 56 176, 48 176 H 28 C 20 176, 12 174, 12 166 V 82 C 12 68, 30 60, 30 48 Z"/>
          </clipPath>
          <linearGradient id="soju-grad-${uniqueId}" x1="0" y1="0" x2="0" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="50%" stop-color="#10b981"/>
            <stop offset="100%" stop-color="#047857"/>
          </linearGradient>
        </defs>
        <g clip-path="url(#soju-clip-${uniqueId})">
          <rect width="76" height="182" fill="#061d11"/>
          <rect x="0" y="${yPos}" width="76" height="${fillHeight}" fill="url(#soju-grad-${uniqueId})" style="transition: all 0.45s ease;"/>
          <ellipse cx="38" cy="${yPos}" rx="26" ry="2.8" fill="#6ee7b7" opacity="${fillPercent > 0 ? 0.75 : 0}"/>
        </g>
        <path d="M 31 10 H 45 V 26 H 31 Z M 30 26 H 46 V 48 C 46 60, 64 68, 64 82 V 166 C 64 174, 56 176, 48 176 H 28 C 20 176, 12 174, 12 166 V 82 C 12 68, 30 60, 30 48 Z" 
              stroke="#22c55e" stroke-width="1.8" stroke-opacity="0.8" fill="rgba(34, 197, 94, 0.06)"/>
        <path d="M 33 46 C 33 58, 16 68, 16 84 V 164" stroke="rgba(255, 255, 255, 0.38)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <rect x="30" y="10" width="16" height="15" rx="2" fill="#1b5e20"/>
        <rect x="18" y="86" width="40" height="56" rx="2.5" fill="#f8fafc" fill-opacity="0.96"/>
        <text x="38" y="106" fill="#0f172a" font-size="9" font-weight="900" text-anchor="middle">원</text>
        <text x="38" y="117" fill="#0f172a" font-size="8.5" font-weight="900" text-anchor="middle">바</text>
        <text x="38" y="128" fill="#0f172a" font-size="8" font-weight="900" text-anchor="middle">틀</text>
        <ellipse cx="25" cy="129" rx="4.5" ry="5.5" fill="#0284c7"/>
        <rect x="16" y="165" width="44" height="6" rx="2" fill="rgba(6, 78, 59, 0.55)"/>
      </svg>`;
    }

    function getBeerMugSvg(uniqueId, fillPercent) {
      const fillHeight = Math.min(Math.max(fillPercent, 0), 1.0) * 115;
      const yPos = 162 - fillHeight;

      return `
      <svg viewBox="0 0 90 180" fill="none">
        <defs>
          <clipPath id="mug-clip-${uniqueId}">
            <path d="M 16 42 H 66 V 160 C 66 168, 60 170, 54 170 H 28 C 22 170, 16 168, 16 160 Z"/>
          </clipPath>
          <linearGradient id="beer-liquid-${uniqueId}" x1="0" y1="40" x2="0" y2="170" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="60%" stop-color="#f59e0b"/>
            <stop offset="100%" stop-color="#d97706"/>
          </linearGradient>
        </defs>
        <path d="M 64 65 C 82 65, 84 80, 84 98 C 84 122, 82 135, 64 135" 
              stroke="rgba(251, 191, 36, 0.7)" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M 64 71 C 77 71, 78 82, 78 98 C 78 116, 77 129, 64 129" 
              stroke="#070a0f" stroke-width="3.5" stroke-linecap="round" fill="none"/>
        <g clip-path="url(#mug-clip-${uniqueId})">
          <rect width="90" height="180" fill="#201305"/>
          <rect x="14" y="${yPos}" width="54" height="${fillHeight}" fill="url(#beer-liquid-${uniqueId})" style="transition: all 0.45s ease;"/>
          <rect x="14" y="${Math.max(34, yPos - 12)}" width="54" height="16" rx="4" fill="#fffbeb" opacity="${fillPercent > 0.05 ? 0.95 : 0}"/>

    };

    // v7 스키마: 소주 1병 기본 단독 체크
    let appConfig = JSON.parse(localStorage.getItem('obConfig_v7')) || {
      isSet: false,
      activeKeys: ['soju'], // 소주만 기본 선택
      targets: {
        soju: { mode: 'bottle', count: 1, totalGlasses: 8 },

        /* etc: { mode: 'glass', count: 2, totalGlasses: 2 } */
      }
    };

    let appSession = JSON.parse(localStorage.getItem('obSession_v7')) || {
      currentTab: 'soju',
      glassStates: {},
      extraCount: {},
      water: 0,
      timeMark: Date.now()
    };

    let streamRef = null;

    function initApp() {
      const now = new Date();
      document.getElementById('header-date').innerText = 
        `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')}`;

      if (Date.now() - appSession.timeMark > 6 * 3600 * 1000) {
        requestReset(false);
      }

      if (!appConfig.isSet || !appConfig.activeKeys || appConfig.activeKeys.length === 0) {
        openSettings();
      } else {
        if (!appConfig.activeKeys.includes(appSession.currentTab)) {
          appSession.currentTab = appConfig.activeKeys[0];
        }
        syncThemeColor();
        renderTabCapsules();
        renderGlassGrid();
        updateMainInterface();
      }
    }

    function syncThemeColor() {
      const activeMeta = BEV_CATALOG[appSession.currentTab] || BEV_CATALOG.soju;
      document.documentElement.style.setProperty('--theme-accent', activeMeta.accent);
      document.documentElement.style.setProperty('--theme-glow', activeMeta.glow);
    }

    function getCheckedCount(key) {
      if (!appSession.glassStates[key]) return 0;
      return Object.values(appSession.glassStates[key]).filter(Boolean).length;
    }

    function calculateTotalProgress() {
      let quotaRatio = 0;
      for (const key of appConfig.activeKeys) {
        const checked = getCheckedCount(key);
        const extra = appSession.extraCount[key] || 0;
        const limit = appConfig.targets[key].totalGlasses;
        quotaRatio += ((checked + extra) / limit);
      }
      return quotaRatio;
    }

    function updateMainInterface() {
      syncThemeColor();
      const progress = calculateTotalProgress();
      const pct = Math.round(progress * 100);

      const curKey = appSession.currentTab;
      const meta = BEV_CATALOG[curKey];
      const target = appConfig.targets[curKey];
      const consumed = getCheckedCount(curKey);
      const extra = appSession.extraCount[curKey] || 0;

      // 상단 유통 쇼케이스 렌더링
      renderShowcaseRack(curKey, target, consumed + extra);

      const pctEl = document.getElementById('status-percent');
      pctEl.innerText = `${pct}%`;
      pctEl.style.color = pct >= 100 ? 'var(--danger)' : 'var(--theme-accent)';

      let bottleStr = '';
      if (curKey === 'whiskey') {
        const mlConsumed = Math.round((consumed + extra) * 31.25);
        const mlTarget = Math.round(target.count * 750);
        bottleStr = ` (${mlConsumed} / ${mlTarget}ml)`;
      } else if (target.mode === 'bottle' && meta.ratio > 1) {
        const curBottle = ((consumed + extra) / meta.ratio).toFixed(1).replace('.0','');
        bottleStr = ` (${curBottle} / ${target.count}병)`;
      } else if (curKey === 'beer') {
        bottleStr = ` (${(consumed + extra) * 500}ml)`;
      }

      document.getElementById('status-desc').innerText = 
        `${meta.name} ${consumed + extra} / ${target.totalGlasses}${meta.glass}${bottleStr}`;

      const amber = document.getElementById('amber-banner');
      const remain = target.totalGlasses - consumed;
      if (progress < 1.0 && (remain === 1 || pct >= 85)) {
        amber.style.display = 'block';
      } else {
        amber.style.display = 'none';
      }

      document.getElementById('h2o-badge').innerText = appSession.water;
      localStorage.setItem('obSession_v7', JSON.stringify(appSession));
    }

    function renderShowcaseRack(key, target, totalConsumed) {
      const rack = document.getElementById('bottles-rack');
      rack.innerHTML = '';

      const meta = BEV_CATALOG[key];

      if (key === 'whiskey') {
        const unit = document.createElement('div');
        unit.className = 'bottle-unit';
        const fillFraction = totalConsumed / target.totalGlasses;
        unit.innerHTML = renderUpperShowcaseSvg('whiskey', 'whiskey-main', fillFraction, target);
        rack.appendChild(unit);
      } else if (key === 'beer') {
        const numMugs = target.count;
        for (let i = 0; i < numMugs; i++) {
          let mugFill = 0;
          if (totalConsumed >= i + 1) {
            mugFill = 1.0;
          } else if (totalConsumed <= i) {
            mugFill = 0;
          } else {
            mugFill = totalConsumed - i;
          }
          const unit = document.createElement('div');
          unit.className = 'bottle-unit mug-unit';
          unit.innerHTML = renderUpperShowcaseSvg('beer', `m-${i}`, mugFill, target);
          rack.appendChild(unit);
        }
      } else {
        const numBottles = target.mode === 'bottle' ? target.count : Math.max(1, Math.ceil(target.totalGlasses / meta.ratio));
        const glassesPerBottle = meta.ratio;

        for (let i = 0; i < numBottles; i++) {
          const start = i * glassesPerBottle;
          const end = (i + 1) * glassesPerBottle;
          let fill = 0;

          if (totalConsumed >= end) {
            fill = 1.0;
          } else if (totalConsumed <= start) {
            fill = 0;
          } else {
            fill = (totalConsumed - start) / glassesPerBottle;
          }

          const unit = document.createElement('div');
          unit.className = 'bottle-unit';
          unit.innerHTML = renderUpperShowcaseSvg(key, `b-${i}`, fill, target);
          rack.appendChild(unit);
        }
      }
    }

    function renderTabCapsules() {
      const bar = document.getElementById('tabs-bar');
      bar.innerHTML = '';

      appConfig.activeKeys.forEach(k => {
        const item = BEV_CATALOG[k];
        const tab = document.createElement('div');
        tab.className = `capsule-tab ${appSession.currentTab === k ? 'active' : ''}`;
        tab.innerHTML = `<span class="icon-badge">${item.iconHtml}</span> <span>${item.name}</span>`;
        tab.onclick = () => {
          appSession.currentTab = k;
          renderTabCapsules();
          renderGlassGrid();
          updateMainInterface();
        };
        bar.appendChild(tab);
      });
    }

    function renderGlassGrid() {
      const grid = document.getElementById('glasses-grid');
      grid.innerHTML = '';

      const key = appSession.currentTab;
      const meta = BEV_CATALOG[key];
      const limit = appConfig.targets[key].totalGlasses;

      if (!appSession.glassStates[key]) {
        appSession.glassStates[key] = {};
      }

      for (let i = 1; i <= limit; i++) {
        const tile = document.createElement('div');
        const isFilled = !!appSession.glassStates[key][i];
        tile.className = `glass-tile ${isFilled ? 'filled' : ''}`;

        const isSoju = key === 'soju';
        tile.innerHTML = `
          <div class="tile-svg-box ${isSoju ? 'soju-glass-box' : ''}">${getLowerGlassSvg(key, isFilled)}</div>
          <div class="tile-label">${i}${meta.glass}</div>
        `;

        tile.onclick = () => onIndividualGlassToggle(i);
        grid.appendChild(tile);
      }

      const consumed = getCheckedCount(key);
      const extra = appSession.extraCount[key] || 0;
      if (consumed >= limit) {
        const extraTile = document.createElement('div');
        extraTile.className = 'glass-tile tile-extra';
        extraTile.innerHTML = `
          <div style="font-size:1.6rem; color:var(--danger); font-weight:800; line-height:1;">+</div>
          <div class="tile-label">초과 ${extra}잔</div>
        `;
        extraTile.onclick = () => onExtraGlassTap();
        grid.appendChild(extraTile);
      }
    }

    function onIndividualGlassToggle(index) {
      const key = appSession.currentTab;
      if (!appSession.glassStates[key]) {
        appSession.glassStates[key] = {};
      }

      appSession.glassStates[key][index] = !appSession.glassStates[key][index];

      renderGlassGrid();
      updateMainInterface();

      if (calculateTotalProgress() >= 1.0 && 'vibrate' in navigator) {
        navigator.vibrate([100, 60, 100]);
      }
    }

    function onExtraGlassTap() {
      const key = appSession.currentTab;
      appSession.extraCount[key] = (appSession.extraCount[key] || 0) + 1;
      renderGlassGrid();
      updateMainInterface();
      triggerRealityMirror();
    }

    function drinkWater() {
      appSession.water = (appSession.water || 0) + 1;
      updateMainInterface();
      if ('vibrate' in navigator) navigator.vibrate(35);
    }

    async function triggerRealityMirror() {
      const modal = document.getElementById('mirror-modal');
      const video = document.getElementById('camera-view');
      modal.style.display = 'flex';

      try {
        streamRef = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' }
        });
        video.srcObject = streamRef;
      } catch (e) {
        console.warn('전면 카메라 접근 불가:', e);
      }
    }

    function closeMirror() {
      document.getElementById('mirror-modal').style.display = 'none';
      if (streamRef) {
        streamRef.getTracks().forEach(t => t.stop());
        streamRef = null;
      }
    }

    /* 설정 모달 (소주 1병 기본 선택 & 5개 주종 콤팩트 렌더링) */
    function openSettings() {
      const container = document.getElementById('settings-card-list');
      container.innerHTML = '';

      for (const [key, meta] of Object.entries(BEV_CATALOG)) {
        const isChecked = appConfig.activeKeys.includes(key);
        const tgt = appConfig.targets[key];

        const card = document.createElement('div');
        card.className = `bev-item-card ${isChecked ? 'selected' : ''}`;
        card.id = `bev-item-${key}`;

        const canToggleUnit = meta.ratio > 1;

        card.innerHTML = `
          <div class="card-topline">
            <label class="bev-check-label">
              <input type="checkbox" id="chk-${key}" ${isChecked ? 'checked' : ''} onchange="toggleBev('${key}')" style="width:18px; height:18px; accent-color:var(--accent-soju);">
              <span class="icon-badge">${meta.iconHtml}</span>
              <span>${meta.name}</span>
            </label>
            ${canToggleUnit ? `
              <div class="unit-switch">
                <button class="unit-opt ${tgt.mode === 'bottle' ? 'on' : ''}" onclick="changeUnit('${key}', 'bottle')">${key === 'whiskey' ? '병(375ml~)' : meta.unit}</button>
                <button class="unit-opt ${tgt.mode === 'glass' ? 'on' : ''}" onclick="changeUnit('${key}', 'glass')">${meta.glass}</button>
              </div>
            ` : `<span style="font-size:0.75rem; color:var(--text-dim); font-weight:600;">500ml 기준</span>`}
          </div>

          <div class="card-bottomline">
            <span class="formula-txt" id="formula-${key}">계산 중...</span>
            <div class="stepper-box">
              <button onclick="stepTarget('${key}', -1)">-</button>
              <strong id="count-disp-${key}">${tgt.count}${tgt.mode === 'bottle' ? '병' : ''}</strong>
              <button onclick="stepTarget('${key}', 1)">+</button>
            </div>
          </div>
        `;
        container.appendChild(card);
        updateCardFormula(key);
      }

      document.getElementById('settings-modal').style.display = 'flex';
    }

    function toggleBev(key) {
      const chk = document.getElementById(`chk-${key}`);
      const card = document.getElementById(`bev-item-${key}`);
      if (chk.checked) {
        if (!appConfig.activeKeys.includes(key)) appConfig.activeKeys.push(key);
        card.classList.add('selected');
      } else {
        appConfig.activeKeys = appConfig.activeKeys.filter(k => k !== key);
        card.classList.remove('selected');
      }
    }

    function changeUnit(key, mode) {
      appConfig.targets[key].mode = mode;
      const meta = BEV_CATALOG[key];
      if (mode === 'bottle') {
        if (key === 'whiskey') {
          appConfig.targets[key].count = 0.5;
        } else {
          appConfig.targets[key].count = Math.max(1, Math.round(appConfig.targets[key].totalGlasses / meta.ratio)) || 1;
        }
      } else {
        appConfig.targets[key].count = appConfig.targets[key].totalGlasses;
      }
      openSettings();
    }

    function stepTarget(key, delta) {
      const tgt = appConfig.targets[key];

      if (key === 'whiskey' && tgt.mode === 'bottle') {
        let cur = tgt.count + (delta * 0.5);
        if (cur < 0.5 || cur > 4.0) return;
        tgt.count = parseFloat(cur.toFixed(1));
        document.getElementById(`count-disp-${key}`).innerText = `${tgt.count}병`;
      } else {
        let cur = tgt.count + delta;
        if (cur < 1 || cur > 30) return;
        tgt.count = cur;
        document.getElementById(`count-disp-${key}`).innerText = `${cur}${tgt.mode === 'bottle' ? '병' : ''}`;
      }
      updateCardFormula(key);
    }

    function updateCardFormula(key) {
      const meta = BEV_CATALOG[key];
      const tgt = appConfig.targets[key];

      if (key === 'beer') {
        tgt.totalGlasses = tgt.count;
        document.getElementById(`formula-${key}`).innerText = 
          `총 ${tgt.count}잔 (${tgt.count * 500}ml)`;
      } else if (key === 'whiskey') {
        if (tgt.mode === 'bottle') {
          tgt.totalGlasses = Math.round(tgt.count * 24);
          const vol = Math.round(tgt.count * 750);
          const label = tgt.count === 0.5 ? '반병 (375ml)' : `${tgt.count}병 (${vol}ml)`;
          document.getElementById(`formula-${key}`).innerText = 
            `${label} = 총 ${tgt.totalGlasses}잔 (샷)`;
        } else {
          tgt.totalGlasses = tgt.count;
          const vol = Math.round(tgt.count * 31.25);
          const bVal = (tgt.count / 24).toFixed(1);
          document.getElementById(`formula-${key}`).innerText = 
            `총 ${tgt.count}잔 (${vol}ml / 약 ${bVal}병)`;
        }
      } else if (tgt.mode === 'bottle') {
        tgt.totalGlasses = Math.round(tgt.count * meta.ratio);
        document.getElementById(`formula-${key}`).innerText = 
          `${tgt.count}${meta.unit} = 총 ${tgt.totalGlasses}${meta.glass} (${meta.standardBottleVol})`;
      } else {
        tgt.totalGlasses = tgt.count;
        const bVal = (tgt.count / meta.ratio).toFixed(1).replace('.0','');
        document.getElementById(`formula-${key}`).innerText = 
          `총 ${tgt.totalGlasses}${meta.glass} (약 ${bVal}${meta.unit})`;
      }
    }

    function commitSettings() {
      if (appConfig.activeKeys.length === 0) {
        alert('최소 하나의 주종을 선택해 주세요.');
        return;
      }
      appConfig.isSet = true;
      localStorage.setItem('obConfig_v7', JSON.stringify(appConfig));
      document.getElementById('settings-modal').style.display = 'none';

      if (!appConfig.activeKeys.includes(appSession.currentTab)) {
        appSession.currentTab = appConfig.activeKeys[0];
      }
      renderTabCapsules();
      renderGlassGrid();
      updateMainInterface();
    }

    function requestReset(ask = true) {
      if (!ask || confirm('오늘의 1차 기록을 초기화하시겠습니까?')) {
        appSession.glassStates = {};
        appSession.extraCount = {};
        appSession.water = 0;
        appSession.timeMark = Date.now();
        localStorage.setItem('obSession_v7', JSON.stringify(appSession));
        renderGlassGrid();
        updateMainInterface();
      }
    }

    initApp();
  </script>
</body>
</html>
