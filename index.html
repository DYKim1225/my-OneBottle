<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="원바틀">
  <meta name="theme-color" content="#0a0c10">
  <title>원바틀 (One Bottle)</title>

  <!-- iOS 홈 화면 고해상도 앱 아이콘(술병 & 고급 글래스 그래픽) 동적 생성 -->
  <script>
    (function generateAppIcon() {
      const canvas = document.createElement('canvas');
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext('2d');

      // 다크 라운지 배경
      const grad = ctx.createLinearGradient(0, 0, 180, 180);
      grad.addColorStop(0, '#0a0c10');
      grad.addColorStop(1, '#161d27');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 180, 180);

      // 외곽 미세 네온 링
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 4;
      ctx.strokeRect(6, 6, 168, 168);

      // 초록 소주병 실루엣
      ctx.fillStyle = '#10b981';
      ctx.fillRect(52, 50, 18, 16); // 넥
      ctx.beginPath();
      ctx.roundRect(43, 66, 36, 75, [8, 8, 4, 4]); // 보디
      ctx.fill();
      // 은색 캡 & 라벨
      ctx.fillStyle = '#cbd5e1';
      ctx.fillRect(54, 42, 14, 9);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(49, 90, 24, 30);

      // 고급 칵테일/와인 글래스 실루엣
      ctx.strokeStyle = '#e11d48';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(95, 65);
      ctx.lineTo(135, 65);
      ctx.lineTo(115, 102);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = 'rgba(225, 29, 72, 0.4)';
      ctx.fill();
      // 글래스 스템 & 베이스
      ctx.beginPath();
      ctx.moveTo(115, 102);
      ctx.lineTo(115, 135);
      ctx.moveTo(100, 135);
      ctx.lineTo(130, 135);
      ctx.stroke();

      // 하단 앱 명 텍스트
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ONE BOTTLE', 90, 162);

      const iconUrl = canvas.toDataURL('image/png');
      const linkTouch = document.createElement('link');
      linkTouch.rel = 'apple-touch-icon';
      linkTouch.href = iconUrl;
      document.head.appendChild(linkTouch);

      const linkFav = document.createElement('link');
      linkFav.rel = 'icon';
      linkFav.type = 'image/png';
      linkFav.href = iconUrl;
      document.head.appendChild(linkFav);
    })();
  </script>

  <style>
    :root {
      --bg: #090b0e;
      --card: #13171f;
      --border: #232936;
      --soju-green: #10b981;
      --danger: #ef4444;
      --amber: #f59e0b;
      --water-blue: #0284c7;
      --text: #f8fafc;
      --muted: #64748b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 80px) 16px;
      touch-action: manipulation;
    }

    /* 초록 소주병 전용 인라인 SVG 아이콘 */
    .soju-icon-svg {
      display: inline-block;
      vertical-align: middle;
      width: 1.2em;
      height: 1.8em;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .header-title h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.5px; }
    .header-title p { font-size: 0.75rem; color: var(--muted); }
    .header-actions { display: flex; gap: 8px; }
    .btn-icon {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* 앰버 알림 */
    #amber-banner {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--amber);
      color: #fbbf24;
      border-radius: 8px;
      padding: 10px;
      margin-top: 12px;
      font-size: 0.8rem;
      text-align: center;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    /* 중앙 보틀 인디케이터 */
    .bottle-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0 10px 0;
    }
    .bottle-indicator-wrap {
      position: relative;
      width: 80px;
      height: 180px;
    }
    .bottle-svg { width: 100%; height: 100%; }
    .liquid-level {
      transition: height 0.4s ease, y 0.4s ease;
    }
    .status-box {
      margin-top: 8px;
      text-align: center;
    }
    .status-percent {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--soju-green);
    }
    .status-sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* 탭 바 */
    .tabs-wrap {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0 12px 0;
      scrollbar-width: none;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tab-item {
      flex: 0 0 auto;
      padding: 8px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .tab-item.active {
      border-color: var(--soju-green);
      color: var(--text);
      font-weight: 700;
      background: rgba(16, 185, 129, 0.08);
    }

    /* 인터랙티브 잔 그리드 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 6px;
    }
    .glass-box {
      aspect-ratio: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s;
    }
    .glass-box:active { transform: scale(0.94); }
    .glass-box.filled {
      border-color: var(--soju-green);
      background: rgba(16, 185, 129, 0.12);
    }
    .glass-box .icon-area { font-size: 1.4rem; opacity: 0.35; }
    .glass-box.filled .icon-area { opacity: 1; filter: drop-shadow(0 0 8px var(--soju-green)); }
    .glass-box .num-tag { font-size: 0.7rem; color: var(--muted); }

    /* 초과 음주 [+] 버튼 */
    .glass-box.extra-btn {
      border: 2px dashed var(--danger);
      background: rgba(239, 68, 68, 0.1);
      animation: pulseDanger 1.5s infinite;
    }
    @keyframes pulseDanger { 0%, 100% { border-color: var(--danger); } 50% { border-color: transparent; } }
    .glass-box.extra-btn .icon-area { opacity: 1; font-size: 1.8rem; color: var(--danger); }
    .glass-box.extra-btn .num-tag { color: var(--danger); font-weight: 700; }

    /* 우측 하단 플로팅 H2O 수분 방어 버튼 */
    .fab-water {
      position: fixed;
      right: 18px;
      bottom: calc(env(safe-area-inset-bottom) + 18px);
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 30px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
      cursor: pointer;
      z-index: 50;
      transition: transform 0.1s;
    }
    .fab-water:active { transform: scale(0.92); }
    .fab-water .water-title { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .fab-water .water-badge {
      background: #fff;
      color: #0369a1;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 12px;
    }

    /* 공통 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(5px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-sheet {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 380px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .modal-sheet h2 { font-size: 1.15rem; font-weight: 800; }
    .modal-sheet p { font-size: 0.8rem; color: var(--muted); }

    /* 온보딩 주종별 설정 카드 */
    .bev-config-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bev-config-card.active {
      border-color: var(--soju-green);
      background: rgba(16, 185, 129, 0.05);
    }
    .bev-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bev-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .unit-toggle {
      display: flex;
      background: var(--bg);
      border-radius: 6px;
      padding: 2px;
      border: 1px solid var(--border);
    }
    .unit-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .unit-btn.selected {
      background: var(--border);
      color: var(--text);
      font-weight: 700;
    }
    .stepper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .calc-info { font-size: 0.75rem; color: var(--muted); }
    .step-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step-control button {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      background: var(--border);
      color: var(--text);
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-submit {
      background: var(--soju-green);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* 거울치료 모달 */
    #mirror-modal .modal-sheet {
      border-color: var(--danger);
      text-align: center;
      padding: 24px;
    }
    .mirror-frame {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      margin: 10px auto;
      overflow: hidden;
      border: 4px solid var(--danger);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
      position: relative;
    }
    #camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>

  <!-- 상단 네비게이션 -->
  <header>
    <div class="header-title">
      <h1>원바틀 · 1차 세션</h1>
      <p id="session-date">세션 준비 중</p>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openConfigModal()">⚙️ 주량 설정</button>
      <button class="btn-icon" onclick="resetSession()">🔄 리셋</button>
    </div>
  </header>

  <!-- 막잔 경고 배너 -->
  <div id="amber-banner">⚠️ 이번 차수 마지막 잔입니다! 물을 마시며 품격 있게 마무리하세요.</div>

  <!-- 보틀 인디케이터 -->
  <section class="bottle-section">
    <div class="bottle-indicator-wrap">
      <svg class="bottle-svg" viewBox="0 0 100 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="custom-bottle-clip">
            <path d="M43 6 H57 V22 H43 Z M41 22 H59 V48 Q59 62 76 72 Q82 76 82 86 V224 Q82 232 72 232 H28 Q18 232 18 224 V86 Q18 76 24 72 Q41 62 41 48 Z" />
          </clipPath>
        </defs>

        <!-- 내부 배경 및 액체 채움 -->
        <g clip-path="url(#custom-bottle-clip)">
          <rect width="100" height="240" fill="#08281a" />
          <rect id="bottle-liquid" x="0" y="232" width="100" height="0" fill="var(--soju-green)" class="liquid-level" />
        </g>

        <!-- 소주병 바디 라인 -->
        <path d="M43 6 H57 V22 H43 Z M41 22 H59 V48 Q59 62 76 72 Q82 76 82 86 V224 Q82 232 72 232 H28 Q18 232 18 224 V86 Q18 76 24 72 Q41 62 41 48 Z" 
              stroke="#2ed573" stroke-width="2.5" stroke-opacity="0.7" fill="none" />
        <!-- 은색 캡 -->
        <rect x="43" y="6" width="14" height="16" rx="2" fill="#94a3b8" />
        <!-- 소주 흰색 라벨 -->
        <rect x="26" y="115" width="48" height="58" rx="3" fill="#ffffff" fill-opacity="0.92" />
        <text x="50" y="142" fill="#064e3b" font-size="9" font-weight="900" text-anchor="middle">원바틀</text>
        <text x="50" y="157" fill="#047857" font-size="6" font-weight="700" text-anchor="middle">1차 1병 절주</text>
      </svg>
    </div>
    <div class="status-box">
      <div class="status-percent" id="total-percent-text">0%</div>
      <div class="status-sub" id="status-detail-text">주량 한계선 대기 중</div>
    </div>
  </section>

  <!-- 주종 탭 바 (선택된 주종만 표시) -->
  <div class="tabs-wrap" id="tabs-container"></div>

  <!-- 잔 선택 그리드 -->
  <div class="grid-container" id="grid-container"></div>

  <!-- 우측 하단 수분 보충 플로팅 버튼 -->
  <div class="fab-water" onclick="addWater()">
    <span style="font-size:1.1rem;">💧</span>
    <span class="water-title">H₂O</span>
    <span class="water-badge" id="water-badge">0</span>
  </div>

  <!-- 온보딩 및 주량 수정 모달 -->
  <div class="modal-overlay" id="config-modal">
    <div class="modal-sheet">
      <div>
        <h2>1차 주량 커스텀 설정</h2>
        <p>오늘 마실 주종을 선택하고 목표 주량을 설정하세요.</p>
      </div>
      <div id="bev-selection-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      <button class="btn-submit" onclick="saveConfiguration()">설정 완료 및 잠금</button>
    </div>
  </div>

  <!-- 초과 음주 전면 카메라 거울치료 모달 -->
  <div class="modal-overlay" id="mirror-modal">
    <div class="modal-sheet">
      <h2 style="color:var(--danger);">⚠️ 주량 한계 도달 (초과 음주)</h2>
      <div class="mirror-frame">
        <video id="camera-video" autoplay playsinline muted></video>
      </div>
      <p style="line-height:1.5;">
        지금 당신의 풀린 눈빛과 붉어진 얼굴을 똑바로 보세요.<br>
        <strong>1차의 품격은 여기서 멈출 때 완성됩니다. 즉시 귀가하세요!</strong>
      </p>
      <button class="btn-submit" style="background:var(--danger); color:#fff;" onclick="dismissMirror()">거울 닫고 스스로 멈추기</button>
    </div>
  </div>

  <script>
    // 6대 주종 규격 정의 (소주는 초록색 소주병 SVG 전용)
    const SOJU_SVG = `
      <svg class="soju-icon-svg" viewBox="0 0 40 70" fill="none">
        <rect x="15" y="2" width="10" height="8" rx="1" fill="#cbd5e1"/>
        <path d="M14 10 H26 V20 Q26 26 34 32 V64 Q34 68 28 68 H12 Q6 68 6 64 V32 Q14 26 14 20 Z" fill="#10b981"/>
        <rect x="10" y="34" width="20" height="22" rx="2" fill="#ffffff" fill-opacity="0.9"/>
        <line x1="13" y1="42" x2="27" y2="42" stroke="#047857" stroke-width="2"/>
      </svg>
    `;

    const BEVERAGE_MASTER = {
      soju:      { name: '소주',      unitType: 'bottle', ratio: 8,   defaultVal: 1, icon: SOJU_SVG, isSvg: true,  unitName: '병', glassName: '잔' },
      beer:      { name: '맥주',      unitType: 'bottle', ratio: 1.5, defaultVal: 2, icon: '🍺',     isSvg: false, unitName: '캔/병', glassName: '잔' },
      wine:      { name: '와인',      unitType: 'bottle', ratio: 5,   defaultVal: 1, icon: '🍷',     isSvg: false, unitName: '병', glassName: '잔' },
      whiskey:   { name: '위스키',    unitType: 'glass',  ratio: 1,   defaultVal: 3, icon: '🥃',     isSvg: false, unitName: '잔', glassName: '잔' },
      makgeolli: { name: '막걸리',    unitType: 'bottle', ratio: 5,   defaultVal: 1, icon: '🍶',     isSvg: false, unitName: '병', glassName: '사발' },
      etc:       { name: '하이볼/기타', unitType: 'glass',  ratio: 1,   defaultVal: 2, icon: '🍹',     isSvg: false, unitName: '잔', glassName: '잔' }
    };

    // 로컬 스토리지 데이터 로드
    let config = JSON.parse(localStorage.getItem('oneBottleConfig_v2')) || {
      isLocked: false,
      selected: ['soju', 'beer'],
      targets: {
        soju: { mode: 'bottle', count: 1, totalGlasses: 8 },
        beer: { mode: 'bottle', count: 2, totalGlasses: 3 },
        wine: { mode: 'bottle', count: 1, totalGlasses: 5 },
        whiskey: { mode: 'glass', count: 3, totalGlasses: 3 },
        makgeolli: { mode: 'bottle', count: 1, totalGlasses: 5 },
        etc: { mode: 'glass', count: 2, totalGlasses: 2 }
      }
    };

    let session = JSON.parse(localStorage.getItem('oneBottleSession_v2')) || {
      activeTab: 'soju',
      records: {}, // { soju: 0, beer: 0 }
      extras: {},  // { soju: 0 }
      water: 0,
      timestamp: Date.now()
    };

    let videoStream = null;

    function init() {
      // 날짜 세팅
      const now = new Date();
      document.getElementById('session-date').innerText = 
        `${now.getFullYear()}. ${String(now.getMonth()+1).padStart(2,'0')}. ${String(now.getDate()).padStart(2,'0')}`;

      // 6시간 초과 세션 리셋
      if (Date.now() - session.timestamp > 6 * 60 * 60 * 1000) {
        resetSession(false);
      }

      // 첫 사용자 강제 온보딩
      if (!config.isLocked || !config.selected || config.selected.length === 0) {
        openConfigModal();
      } else {
        if (!config.selected.includes(session.activeTab)) {
          session.activeTab = config.selected[0];
        }
        renderTabs();
        renderGrid();
        updateDashboard();
      }
    }

    // 통합 주량 진척도 계산 (%)
    function getCombinedProgress() {
      let sum = 0;
      for (const key of config.selected) {
        const consumed = (session.records[key] || 0) + (session.extras[key] || 0);
        const target = config.targets[key].totalGlasses;
        sum += (consumed / target);
      }
      return sum;
    }

    function updateDashboard() {
      const progress = getCombinedProgress();
      const percent = Math.round(progress * 100);

      // SVG 액체 차오름 계산 (최대 200px 높이)
      const liquid = document.getElementById('bottle-liquid');
      const fillHeight = Math.min(progress, 1.0) * 196;
      liquid.setAttribute('y', 232 - fillHeight);
      liquid.setAttribute('height', fillHeight);

      // 텍스트 업데이트
      const percentEl = document.getElementById('total-percent-text');
      percentEl.innerText = `${percent}%`;
      percentEl.style.color = percent >= 100 ? 'var(--danger)' : 'var(--soju-green)';

      const curKey = session.activeTab;
      const meta = BEVERAGE_MASTER[curKey];
      const curTarget = config.targets[curKey];
      const consumed = session.records[curKey] || 0;
      const extra = session.extras[curKey] || 0;

      let bottleStr = '';
      if (curTarget.mode === 'bottle') {
        const bCount = (consumed / meta.ratio).toFixed(1).replace('.0','');
        bottleStr = ` (${bCount} / ${curTarget.count}병)`;
      }

      document.getElementById('status-detail-text').innerText = 
        `${meta.name}: ${consumed + extra} / ${curTarget.totalGlasses}${meta.glassName}${bottleStr}`;

      // 앰버 알림 (잔여 1잔 또는 85% 도달 시)
      const amber = document.getElementById('amber-banner');
      const remain = curTarget.totalGlasses - consumed;
      if (progress < 1.0 && (remain === 1 || percent >= 85)) {
        amber.style.display = 'block';
      } else {
        amber.style.display = 'none';
      }

      document.getElementById('water-badge').innerText = session.water;
      localStorage.setItem('oneBottleSession_v2', JSON.stringify(session));
    }

    function renderTabs() {
      const container = document.getElementById('tabs-container');
      container.innerHTML = '';

      config.selected.forEach(key => {
        const item = BEVERAGE_MASTER[key];
        const btn = document.createElement('div');
        btn.className = `tab-item ${session.activeTab === key ? 'active' : ''}`;
        btn.innerHTML = `${item.icon} <span>${item.name}</span>`;
        btn.onclick = () => {
          session.activeTab = key;
          renderTabs();
          renderGrid();
          updateDashboard();
        };
        container.appendChild(btn);
      });
    }

    function renderGrid() {
      const grid = document.getElementById('grid-container');
      grid.innerHTML = '';

      const key = session.activeTab;
      const meta = BEVERAGE_MASTER[key];
      const total = config.targets[key].totalGlasses;
      const consumed = session.records[key] || 0;
      const extra = session.extras[key] || 0;

      // 주량 기본 잔 생성
      for (let i = 1; i <= total; i++) {
        const box = document.createElement('div');
        const isFilled = i <= consumed;
        box.className = `glass-box ${isFilled ? 'filled' : ''}`;
        box.innerHTML = `
          <div class="icon-area">${meta.icon}</div>
          <div class="num-tag">${i}${meta.glassName}</div>
        `;
        box.onclick = () => handleGlassTap(i);
        grid.appendChild(box);
      }

      // 주량 완충 시 초과 잔 [+] 버튼 생성
      if (consumed >= total) {
        const extraBtn = document.createElement('div');
        extraBtn.className = 'glass-box extra-btn';
        extraBtn.innerHTML = `
          <div class="icon-area">+</div>
          <div class="num-tag">초과 ${extra}잔</div>
        `;
        extraBtn.onclick = () => handleExtraGlass();
        grid.appendChild(extraBtn);
      }
    }

    function handleGlassTap(index) {
      const key = session.activeTab;
      const current = session.records[key] || 0;

      if (index === current) {
        // 채워진 마지막 잔 탭 시 취소(-1)
        session.records[key]--;
      } else {
        session.records[key] = index;
      }
      renderGrid();
      updateDashboard();

      // 주량 도달 시 진동 (iOS/안드로이드 지원 기기)
      if (getCombinedProgress() >= 1.0) {
        if ('vibrate' in navigator) navigator.vibrate([100, 50, 100]);
      }
    }

    function handleExtraGlass() {
      const key = session.activeTab;
      session.extras[key] = (session.extras[key] || 0) + 1;
      renderGrid();
      updateDashboard();
      triggerRealityCheck();
    }

    function addWater() {
      session.water = (session.water || 0) + 1;
      updateDashboard();
      if ('vibrate' in navigator) navigator.vibrate(40);
    }

    // 전면 카메라 거울치료 WebRTC
    async function triggerRealityCheck() {
      const modal = document.getElementById('mirror-modal');
      const video = document.getElementById('camera-video');
      modal.style.display = 'flex';

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' }
        });
        video.srcObject = videoStream;
      } catch (e) {
        console.warn('전면 카메라 권한 없음 또는 미지원', e);
      }
    }

    function dismissMirror() {
      document.getElementById('mirror-modal').style.display = 'none';
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
    }

    // 주량 설정 온보딩 렌더링
    function openConfigModal() {
      const list = document.getElementById('bev-selection-list');
      list.innerHTML = '';

      for (const [key, meta] of Object.entries(BEVERAGE_MASTER)) {
        const isSelected = config.selected.includes(key);
        const target = config.targets[key];

        const card = document.createElement('div');
        card.className = `bev-config-card ${isSelected ? 'active' : ''}`;
        card.id = `bev-card-${key}`;

        card.innerHTML = `
          <div class="bev-card-header">
            <label class="bev-title-box">
              <input type="checkbox" id="check-${key}" ${isSelected ? 'checked' : ''} onchange="toggleBevSelect('${key}')" style="width:18px; height:18px;">
              <span>${meta.icon} ${meta.name}</span>
            </label>
            ${meta.ratio > 1 ? `
              <div class="unit-toggle">
                <button class="unit-btn ${target.mode === 'bottle' ? 'selected' : ''}" onclick="setBevUnit('${key}', 'bottle')">${meta.unitName}</button>
                <button class="unit-btn ${target.mode === 'glass' ? 'selected' : ''}" onclick="setBevUnit('${key}', 'glass')">${meta.glassName}</button>
              </div>
            ` : `<span style="font-size:0.75rem; color:var(--muted);">잔 전용</span>`}
          </div>

          <div class="stepper-row" id="stepper-row-${key}">
            <span class="calc-info" id="calc-info-${key}">계산 중...</span>
            <div class="step-control">
              <button onclick="changeCount('${key}', -1)">-</button>
              <strong id="count-val-${key}" style="min-width:24px; text-align:center;">${target.count}</strong>
              <button onclick="changeCount('${key}', 1)">+</button>
            </div>
          </div>
        `;
        list.appendChild(card);
        updateCardCalcInfo(key);
      }

      document.getElementById('config-modal').style.display = 'flex';
    }

    function toggleBevSelect(key) {
      const chk = document.getElementById(`check-${key}`);
      const card = document.getElementById(`bev-card-${key}`);
      if (chk.checked) {
        if (!config.selected.includes(key)) config.selected.push(key);
        card.classList.add('active');
      } else {
        config.selected = config.selected.filter(k => k !== key);
        card.classList.remove('active');
      }
    }

    function setBevUnit(key, unit) {
      config.targets[key].mode = unit;
      const meta = BEVERAGE_MASTER[key];
      // 단위 전환 시 기본값 보정
      if (unit === 'bottle') {
        config.targets[key].count = Math.max(1, Math.round(config.targets[key].totalGlasses / meta.ratio)) || 1;
      } else {
        config.targets[key].count = config.targets[key].totalGlasses;
      }
      openConfigModal(); // 재렌더링
    }

    function changeCount(key, delta) {
      const cur = config.targets[key].count + delta;
      if (cur < 1 || cur > 30) return;
      config.targets[key].count = cur;
      document.getElementById(`count-val-${key}`).innerText = cur;
      updateCardCalcInfo(key);
    }

    function updateCardCalcInfo(key) {
      const meta = BEVERAGE_MASTER[key];
      const target = config.targets[key];
      if (target.mode === 'bottle') {
        target.totalGlasses = Math.round(target.count * meta.ratio);
        document.getElementById(`calc-info-${key}`).innerText = 
          `${target.count}${meta.unitName} = 총 ${target.totalGlasses}${meta.glassName}`;
      } else {
        target.totalGlasses = target.count;
        const bVal = (target.count / meta.ratio).toFixed(1).replace('.0','');
        document.getElementById(`calc-info-${key}`).innerText = 
          meta.ratio > 1 ? `총 ${target.totalGlasses}${meta.glassName} (약 ${bVal}${meta.unitName})` : `총 ${target.totalGlasses}${meta.glassName}`;
      }
    }

    function saveConfiguration() {
      if (config.selected.length === 0) {
        alert('최소 하나 이상의 마실 주종을 선택해주세요!');
        return;
      }
      config.isLocked = true;
      localStorage.setItem('oneBottleConfig_v2', JSON.stringify(config));
      document.getElementById('config-modal').style.display = 'none';

      if (!config.selected.includes(session.activeTab)) {
        session.activeTab = config.selected[0];
      }
      renderTabs();
      renderGrid();
      updateDashboard();
    }

    function resetSession(needConfirm = true) {
      if (!needConfirm || confirm('오늘의 1차 기록을 초기화하시겠습니까?')) {
        session.records = {};
        session.extras = {};
        session.water = 0;
        session.timestamp = Date.now();
        localStorage.setItem('oneBottleSession_v2', JSON.stringify(session));
        renderGrid();
        updateDashboard();
      }
    }

    init();
  </script>
</body>
</html>
